aid: vico
name: Vico
description: >-
  Vico (getvico.com) is a Colombian marketplace for finding and renting furnished rooms,
  aparta-estudios, and apartments for shared, medium- to long-term stays across cities such
  as Bogotá and Medellín. Guests browse and book verified co-living spaces while hosts list
  and manage rooms, under the tagline "Ama donde vives" (Love where you live). It is a
  consumer-facing accommodation platform backed by 500 Global; it exposes no public developer
  API program, OpenAPI, GraphQL, or /.well-known discovery surface as of this enrichment pass.
